[package]
name = "rpg-encoder"
version = "0.1.0"
edition = "2021"
description = "Repository Planning Graph encoder for code analysis"
license = "Apache-2.0"

[features]
default = []
llm = ["reqwest", "tokio", "futures"]
# Embeddings: vector search over node text. Only needs async-trait + the same
# HTTP stack (reqwest/tokio/futures) that the embedding client uses. Does NOT
# require the llm feature — someone could embed features from SCIP or manual
# sources without LLM enrichment.
embeddings = ["async-trait", "reqwest", "tokio", "futures"]
# zvec backend for embeddings (Alibaba's in-process vector DB). Off by default:
# brings in a C++/Proxima native build dependency. Use only when scale demands.
zvec = ["embeddings", "dep:zvec-bindings"]

[dependencies]
petgraph = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-ruby = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-lua = { workspace = true }
tree-sitter-haskell = { workspace = true }
tree-sitter-c-sharp = { workspace = true }
tree-sitter-scala = { workspace = true }
ignore = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
rustc-hash = "2"

# Optional LLM dependencies
reqwest = { version = "0.12", features = ["json", "rustls-tls"], optional = true, default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
futures = { workspace = true, optional = true }

# Optional embeddings dependencies
async-trait = { version = "0.1", optional = true }

# Optional zvec backend (Alibaba's in-process vector DB). Off by default:
# brings in a C++/Proxima native build dependency. Enable with `zvec` feature.
zvec-bindings = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
dotenvy = "0.15"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
insta = { version = "1.39", features = ["json", "yaml"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = { workspace = true }


