[package]
name = "rpg-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
rpg-encoder = { path = "../rpg-encoder", features = ["llm", "embeddings"] }
rmcp = { version = "0.6", features = ["server", "macros", "transport-io"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
notify = "8"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
dotenvy = "0.15"
parking_lot = "0.12"

[dev-dependencies]
rmcp = { version = "0.6", features = ["server", "client", "transport-child-process"] }
tempfile = "3"
serde_json = { workspace = true }
proptest = "1.4"
insta = { version = "1.39", features = ["json"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mcp_tools"
harness = false
